name: Build & Release (macOS + Windows)

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Upload build artifacts to GitHub Release (when run on a tag or latest version)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install native media dependencies (mpv + ffmpeg)
        run: |
          brew update
          brew install mpv ffmpeg

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests & TypeScript build check
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          pnpm build

      - name: Build Tauri macOS arm64 .app
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin --bundles app

      - name: Bundle self-contained libmpv, MoltenVK, ffmpeg & ffprobe
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/HDRCut.app"
          bash scripts/bundle-macos-libs.sh "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Package macOS DMG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/HDRCut.app"
          STAGE_DIR="dist-release/dmg-stage"
          OUT_DIR="dist-release/macos"
          mkdir -p "$STAGE_DIR" "$OUT_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/HDRCut.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create \
            -volname "HDRCut ${VERSION}" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            "$OUT_DIR/HDRCut-${VERSION}-macos-arm64.dmg"
          ls -lh "$OUT_DIR"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDRCut-macos-arm64
          path: dist-release/macos/*.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows (x64 Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests & TypeScript build check
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          pnpm build

      - name: Build Tauri Windows x64 executable
        run: npx --yes @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc --no-bundle

      - name: Fetch Windows x64 runtime dependencies (ffmpeg, ffprobe, libmpv-2.dll)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depsDir = "dist-windows-deps"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null

          Write-Host "==> Downloading Windows x64 FFmpeg essentials..."
          $ffZip = Join-Path $depsDir "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffZip
          $ffTmp = Join-Path $depsDir "_fftmp"
          Expand-Archive -Path $ffZip -DestinationPath $ffTmp -Force
          Get-ChildItem -Path $ffTmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 | Copy-Item -Destination (Join-Path $depsDir "ffmpeg.exe")
          Get-ChildItem -Path $ffTmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1 | Copy-Item -Destination (Join-Path $depsDir "ffprobe.exe")
          Remove-Item -Recurse -Force $ffTmp, $ffZip

          Write-Host "==> Downloading latest Windows x64 libmpv-2.dll..."
          $headers = @{ "User-Agent" = "HDRCut-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $($env:GITHUB_TOKEN)" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find mpv-dev-x86_64 .7z asset in shinchiro/mpv-winbuild-cmake" }
          $mpv7z = Join-Path $depsDir "mpv-dev.7z"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $mpv7z
          $mpvTmp = Join-Path $depsDir "_mpvtmp"
          New-Item -ItemType Directory -Force -Path $mpvTmp | Out-Null
          7z x -y $mpv7z "-o$mpvTmp" | Out-Null
          $dll = Get-ChildItem -Path $mpvTmp -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found inside archive" }
          Copy-Item -Path $dll.FullName -Destination (Join-Path $depsDir "libmpv-2.dll")
          Remove-Item -Recurse -Force $mpvTmp, $mpv7z

          Get-ChildItem $depsDir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows x64 Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $stageDir = "dist-release\HDRCut-${version}-windows-x64"
          $outDir = "dist-release\windows"
          New-Item -ItemType Directory -Force -Path $stageDir, $outDir | Out-Null

          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\hdrcut.exe" (Join-Path $stageDir "HDRCut.exe")
          Copy-Item "dist-windows-deps\libmpv-2.dll" (Join-Path $stageDir "libmpv-2.dll")
          Copy-Item "dist-windows-deps\ffmpeg.exe" (Join-Path $stageDir "ffmpeg.exe")
          Copy-Item "dist-windows-deps\ffprobe.exe" (Join-Path $stageDir "ffprobe.exe")
          Copy-Item "README.md" (Join-Path $stageDir "README.md")
          Copy-Item "LICENSE" (Join-Path $stageDir "LICENSE")

          $zipPath = Join-Path $outDir "HDRCut-${version}-windows-x64-portable.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force
          Get-ChildItem $outDir

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDRCut-windows-x64
          path: dist-release/windows/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            VERSION="$(node -p "require('./package.json').version")"
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: List release assets
        run: ls -lh release-artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HDRCut ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
