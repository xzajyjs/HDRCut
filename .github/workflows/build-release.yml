name: Build & Release (macOS + Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish build artifacts to GitHub Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-macos-arm64:
    name: Build macOS (Apple Silicon arm64)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install native media dependencies (mpv + ffmpeg)
        run: |
          brew update
          brew install mpv ffmpeg

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests & TypeScript build check
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          pnpm build

      - name: Build Tauri macOS arm64 .app
        run: npx --yes @tauri-apps/cli@2 build --target aarch64-apple-darwin --bundles app

      - name: Bundle self-contained libmpv, MoltenVK, ffmpeg & ffprobe
        run: |
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/HDRCut.app"
          bash scripts/bundle-macos-libs.sh "$APP_PATH"
          codesign --verify --deep --strict "$APP_PATH"

      - name: Package macOS DMG
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          APP_PATH="src-tauri/target/aarch64-apple-darwin/release/bundle/macos/HDRCut.app"
          STAGE_DIR="dist-release/dmg-stage"
          OUT_DIR="dist-release/macos"
          mkdir -p "$STAGE_DIR" "$OUT_DIR"
          cp -R "$APP_PATH" "$STAGE_DIR/HDRCut.app"
          ln -s /Applications "$STAGE_DIR/Applications"
          hdiutil create \
            -volname "HDRCut ${VERSION}" \
            -srcfolder "$STAGE_DIR" \
            -ov -format UDZO \
            "$OUT_DIR/HDRCut-${VERSION}-macos-arm64.dmg"
          ls -lh "$OUT_DIR"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDRCut-macos-arm64
          path: dist-release/macos/*.dmg
          if-no-files-found: error

  build-windows-x64:
    name: Build Windows (x64 Portable)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Rust (x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Rust unit tests & TypeScript build check
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml
          pnpm build

      - name: Build Tauri Windows x64 executable
        run: npx --yes @tauri-apps/cli@2 build --target x86_64-pc-windows-msvc --no-bundle

      - name: Fetch Windows x64 runtime dependencies (ffmpeg, ffprobe, libmpv-2.dll)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $depsDir = "dist-windows-deps"
          New-Item -ItemType Directory -Force -Path $depsDir | Out-Null

          Write-Host "==> Downloading Windows x64 FFmpeg essentials..."
          $ffZip = Join-Path $depsDir "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffZip
          $ffTmp = Join-Path $depsDir "_fftmp"
          Expand-Archive -Path $ffZip -DestinationPath $ffTmp -Force
          Get-ChildItem -Path $ffTmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1 | Copy-Item -Destination (Join-Path $depsDir "ffmpeg.exe")
          Get-ChildItem -Path $ffTmp -Recurse -Filter "ffprobe.exe" | Select-Object -First 1 | Copy-Item -Destination (Join-Path $depsDir "ffprobe.exe")
          Remove-Item -Recurse -Force $ffTmp, $ffZip

          Write-Host "==> Downloading latest Windows x64 libmpv-2.dll..."
          $headers = @{ "User-Agent" = "HDRCut-CI" }
          if ($env:GITHUB_TOKEN) { $headers["Authorization"] = "Bearer $($env:GITHUB_TOKEN)" }
          $rel = Invoke-RestMethod -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest" -Headers $headers
          $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*v3*" } | Select-Object -First 1
          if (-not $asset) { throw "Could not find mpv-dev-x86_64 .7z asset in shinchiro/mpv-winbuild-cmake" }
          $mpv7z = Join-Path $depsDir "mpv-dev.7z"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $mpv7z
          $mpvTmp = Join-Path $depsDir "_mpvtmp"
          New-Item -ItemType Directory -Force -Path $mpvTmp | Out-Null
          7z x -y $mpv7z "-o$mpvTmp" | Out-Null
          $dll = Get-ChildItem -Path $mpvTmp -Recurse -Filter "libmpv-2.dll" | Select-Object -First 1
          if (-not $dll) { throw "libmpv-2.dll not found inside archive" }
          Copy-Item -Path $dll.FullName -Destination (Join-Path $depsDir "libmpv-2.dll")
          Remove-Item -Recurse -Force $mpvTmp, $mpv7z

          Get-ChildItem $depsDir
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Windows x64 Portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $stageDir = "dist-release\HDRCut-${version}-windows-x64"
          $outDir = "dist-release\windows"
          New-Item -ItemType Directory -Force -Path $stageDir, $outDir | Out-Null

          Copy-Item "src-tauri\target\x86_64-pc-windows-msvc\release\hdrcut.exe" (Join-Path $stageDir "HDRCut.exe")
          Copy-Item "dist-windows-deps\libmpv-2.dll" (Join-Path $stageDir "libmpv-2.dll")
          Copy-Item "dist-windows-deps\ffmpeg.exe" (Join-Path $stageDir "ffmpeg.exe")
          Copy-Item "dist-windows-deps\ffprobe.exe" (Join-Path $stageDir "ffprobe.exe")
          Copy-Item "README.md" (Join-Path $stageDir "README.md")
          Copy-Item "LICENSE" (Join-Path $stageDir "LICENSE")

          $zipPath = Join-Path $outDir "HDRCut-${version}-windows-x64-portable.zip"
          Compress-Archive -Path "$stageDir\*" -DestinationPath $zipPath -Force
          Get-ChildItem $outDir

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: HDRCut-windows-x64
          path: dist-release/windows/*.zip
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs: [build-macos-arm64, build-windows-x64]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Resolve release tag & aggregate bilingual CHANGELOG since previous release
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            VERSION="$(node -p "require('./package.json').version")"
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          python3 - "$TAG" "${GITHUB_REPOSITORY}" <<'PY'
          import re, subprocess, sys

          tag = sys.argv[1]
          repo = sys.argv[2]

          def parse_ver(s):
              s = s.strip().lstrip("vV").split("-")[0].split("+")[0]
              parts = s.split(".")
              if len(parts) < 1 or not all(p.isdigit() for p in parts[:3]):
                  return None
              nums = [int(p) for p in parts[:3]]
              while len(nums) < 3:
                  nums.append(0)
              return tuple(nums)

          cur_ver = parse_ver(tag)
          cur_ver_str = tag.lstrip("vV")

          # Find the latest existing git release tag strictly older than cur_ver
          tags_out = subprocess.check_output(["git", "tag", "--list", "v*"], text=True)
          older_tags = []
          for t in tags_out.splitlines():
              v = parse_ver(t)
              if v is not None and cur_ver is not None and v < cur_ver:
                  older_tags.append((v, t.strip()))
          older_tags.sort(reverse=True)
          prev_ver, prev_tag = older_tags[0] if older_tags else (None, None)

          text = open("CHANGELOG.md", encoding="utf-8").read()
          sec_re = re.compile(
              r"^## \[([^\]]+)\](?:\s*-\s*([^\n]+))?\n(.*?)(?=^---|\n## \[|\Z)",
              re.MULTILINE | re.DOTALL,
          )

          matched = []
          for m in sec_re.finditer(text):
              ver_str = m.group(1).strip()
              date_str = (m.group(2) or "").strip()
              body = m.group(3).strip()
              v = parse_ver(ver_str)
              if v is None or cur_ver is None:
                  continue
              if prev_ver is not None:
                  if prev_ver < v <= cur_ver:
                      matched.append((v, ver_str, date_str, body))
              else:
                  if v == cur_ver:
                      matched.append((v, ver_str, date_str, body))

          matched.sort(key=lambda item: item[0], reverse=True)

          def split_lang(body):
              en_m = re.search(r"^### English\s*\n(.*?)(?=^### |\Z)", body, re.MULTILINE | re.DOTALL)
              zh_m = re.search(r"^### 中文\s*\n(.*?)(?=^### |\Z)", body, re.MULTILINE | re.DOTALL)
              return (
                  en_m.group(1).strip() if en_m else "",
                  zh_m.group(1).strip() if zh_m else "",
              )

          en_blocks = []
          zh_blocks = []
          fallback_blocks = []
          multi = len(matched) > 1

          for _, ver_str, date_str, body in matched:
              en_txt, zh_txt = split_lang(body)
              heading = f"#### v{ver_str}" + (f" ({date_str})" if date_str else "")
              if en_txt or zh_txt:
                  if en_txt:
                      en_blocks.append(f"{heading}\n{en_txt}" if multi else en_txt)
                  if zh_txt:
                      zh_blocks.append(f"{heading}\n{zh_txt}" if multi else zh_txt)
              else:
                  fallback_blocks.append(f"{heading}\n{body}" if multi else body)

          parts = []
          if prev_tag and multi:
              parts.append(f"> Includes all updates from **{prev_tag}** to **{tag}** / 包含自 **{prev_tag}** 至 **{tag}** 期间的全部更新")

          if en_blocks:
              parts.append("### English\n\n" + "\n\n".join(en_blocks))
          if zh_blocks:
              parts.append("### 中文\n\n" + "\n\n".join(zh_blocks))
          if not en_blocks and not zh_blocks:
              parts.append("\n\n".join(fallback_blocks) if fallback_blocks else f"Release {tag}")

          footer = (
              "\n\n---\n\n"
              "### Downloads / 安装包说明\n"
              f"- **macOS (Apple Silicon arm64)**: `HDRCut-{cur_ver_str}-macos-arm64.dmg` — self-contained (`libmpv`, `ffmpeg`, `ffprobe` bundled). If Gatekeeper warns on first launch, run `xattr -cr /Applications/HDRCut.app`.\n"
              f"- **Windows (x64 Portable)**: `HDRCut-{cur_ver_str}-windows-x64-portable.zip` — extract and run `HDRCut.exe` directly.\n\n"
              f"> 📜 Full release history / 查看所有历史版本更新日志: [CHANGELOG.md](https://github.com/{repo}/blob/main/CHANGELOG.md)\n"
          )

          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write("\n\n".join(parts) + footer)
          PY
          cat release-notes.md

      - name: List release assets
        run: ls -lh release-artifacts

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HDRCut ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            release-artifacts/*.dmg
            release-artifacts/*.zip
